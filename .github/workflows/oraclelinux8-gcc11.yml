name: Oracle Linux 8 GCC 11.5

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      POLICY: manylinux_2_28
      PLATFORM: x86_64
      MANYLINUX_VARIANT: oraclelinux8-gcc11
      COMMIT_SHA: ${{ github.sha }}
      MANYLINUX_IMAGE: manylinux_2_28_oraclelinux8_gcc11_x86_64:${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Check variant selection
        run: python3 tests/test-build-variant.py
      - name: Build and run upstream and Oracle tests
        run: ./build.sh
      - name: Test repaired wheel in clean AlmaLinux 8
        run: ./tests/test-oraclelinux8-clean.sh "${MANYLINUX_IMAGE}"
