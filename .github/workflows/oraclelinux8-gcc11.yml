name: Oracle Linux 8 GCC 11.5

on:
  workflow_dispatch:
    inputs:
      test_upstream_runtime:
        description: Also test the repaired wheel in the upstream manylinux image
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x86_64
            runner: ubuntu-24.04
          - platform: aarch64
            runner: ubuntu-24.04-arm
    env:
      POLICY: manylinux_2_28
      PLATFORM: ${{ matrix.platform }}
      MANYLINUX_VARIANT: oraclelinux8-gcc11
      COMMIT_SHA: ${{ github.sha }}
      MANYLINUX_IMAGE: manylinux_2_28_oraclelinux8_gcc11_${{ matrix.platform }}:${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Check variant selection
        run: python3 tests/test-build-variant.py
      - name: Build and run upstream and Oracle tests
        run: ./build.sh
      - name: Test repaired wheel in clean AlmaLinux 8
        run: ./tests/test-oraclelinux8-clean.sh "${MANYLINUX_IMAGE}"
      - name: Test repaired wheel in upstream manylinux
        if: inputs.test_upstream_runtime
        run: ./tests/test-oraclelinux8-upstream.sh "${MANYLINUX_IMAGE}"
